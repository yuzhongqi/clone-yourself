name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.demo
      - run: python -m examples.agent_demo
      - run: python -m examples.lifecycle_demo --output "$RUNNER_TEMP/llr-lifecycle"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
